name: poppy
x-runtime: &runtime
  network_mode: host
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    - /run/poppy:rw,nosuid,nodev,size=1m,uid=10001,gid=10001
  # Routine deployments use runtime.py stop and wait, NOT Docker's timed kill.
  stop_grace_period: 5m
  healthcheck:
    test: ["CMD", "python3", "/opt/poppy/runtime.py", "health"]
    interval: 5s
    timeout: 5s
    start_period: 90s
    retries: 6
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  pvp:
    <<: *runtime
    image: ${PVP_IMAGE:?digest required}
    volumes:
      - "${DATA_ROOT:?persistent mount required}/state/pvp:/data"
      - type: bind
        source: ${DATA_ROOT:?persistent mount required}/secrets/postgres-app-password.txt
        target: /run/secrets/postgres-app-password.txt
        read_only: true
        bind:
          create_host_path: false
  lobby:
    <<: *runtime
    image: ${LOBBY_IMAGE:?digest required}
    volumes: ["${DATA_ROOT:?persistent mount required}/state/lobby:/data"]
  survival:
    <<: *runtime
    image: ${SURVIVAL_IMAGE:?digest required}
    volumes: ["${DATA_ROOT:?persistent mount required}/state/survival:/data"]
    healthcheck:
      test: ["CMD", "python3", "/opt/poppy/runtime.py", "health"]
      interval: 5s
      timeout: 5s
      start_period: 180s
      retries: 12
  proxy:
    <<: *runtime
    image: ${PROXY_IMAGE:?digest required}
    volumes: ["${DATA_ROOT:?persistent mount required}/state/proxy:/data"]
