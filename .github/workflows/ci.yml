name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/gcp fmt -check -recursive
      - run: terraform -chdir=infra/gcp init -backend=false -input=false
      - run: terraform -chdir=infra/gcp validate
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Fetch pinned WindSpigot dependency
        run: |
          mkdir -p runtime
          curl --fail --location --retry 3 -o runtime/windspigot.jar \
            https://github.com/Wind-Development/WindSpigot/releases/download/v2.1.3/WindSpigot-2.1.3.jar
          echo '53d8553521474035762f0652e5dab8f2c37007af0980eecce7a904d3aa84f484  runtime/windspigot.jar' | sha256sum -c -
      - run: mvn --batch-mode verify
      - run: mvn --batch-mode -f lobby-plugin/pom.xml verify
