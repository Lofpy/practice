name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  database-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker pull postgres:18.6-bookworm
      - name: Verify real PostgreSQL backup and rollback
        run: sudo env POPPY_DATABASE_INTEGRATION=1 python3 -m unittest discover -s deploy/tests -p test_database.py -v
  deployment-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml python3-toml
      - run: /usr/bin/python3 -m unittest discover -s deploy/tests -v
      - run: bash -n deploy/build-images.sh deploy/smoke.sh && sh -n deploy/entrypoint.sh deploy/deploy.sh
  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build all four images and run Java 8 and Java 25 Maven tests
        run: bash deploy/build-images.sh poppy-local ci
      - name: Validate Compose
        env:
          PVP_IMAGE: poppy-local/pvp:ci
          LOBBY_IMAGE: poppy-local/lobby:ci
          PROXY_IMAGE: poppy-local/proxy:ci
          SURVIVAL_IMAGE: poppy-local/survival:ci
          DATA_ROOT: /tmp/poppy-smoke
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Verify runtime, EULA rejection and real proxy readiness/shutdown
        run: bash deploy/smoke.sh poppy-local ci
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: runtime-smoke-evidence
          path: |
            .build/*.json
            .build/*.log
          retention-days: 7
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - run: terraform -chdir=infra/gcp fmt -check -diff -recursive
      - run: terraform -chdir=infra/gcp init -backend=false -input=false -no-color
      - run: terraform -chdir=infra/gcp validate -no-color
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Fetch pinned WindSpigot dependency
        run: |
          mkdir -p runtime
          curl --fail --location --retry 3 -o runtime/windspigot.jar \
            https://github.com/Wind-Development/WindSpigot/releases/download/v2.1.3/WindSpigot-2.1.3.jar
          echo '53d8553521474035762f0652e5dab8f2c37007af0980eecce7a904d3aa84f484  runtime/windspigot.jar' | sha256sum -c -
      - name: Regress CraftPlayer initialization in a fresh JVM
        run: mvn --batch-mode -Dtest=ComboCombatLiveUpdateTest test
      - name: Verify Practice
        run: mvn --batch-mode verify
      - name: Verify Lobby
        if: ${{ !cancelled() }}
        run: mvn --batch-mode -f lobby-plugin/pom.xml verify
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/
            lobby-plugin/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
  modern-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Survival and actual-client protocol gate
        run: |
          mvn --batch-mode -f survival-plugin/pom.xml verify
          mvn --batch-mode -f proxy-plugin/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: modern-surefire-reports
          path: |
            survival-plugin/target/surefire-reports/
            proxy-plugin/target/surefire-reports/
          retention-days: 7
