name: PoppyPractice
main: com.poppy.practice.PracticePlugin
version: 0.1.0
description: NoDebuff 1v1 practice server
author: poppy
softdepend: [ProtocolSupport, ViaVersion]
commands:
  tierreset:
    description: Back up and reset selected certification results and ELO (administrator only)
    usage: /tierreset <player|UUID|all> [nodebuff|boxing|combo|all]
    permission: practice.admin
  tier:
    description: Play three fixed-bot certification matches per kit to unlock Ranked Queue
    usage: /tier [nodebuff|boxing|combo]
    aliases: [tiertest, placement]
  elo:
    description: Show your per-kit ELO and certification progress
    usage: /elo [nodebuff|boxing|combo]
  duel:
    description: Invite another player to a match without ELO changes
    usage: /duel <player> [kit] or /duel <accept|deny> <player>
  settings:
    description: Choose your match kill effect in the PvP lobby
    usage: /settings
  practice:
    description: Practice administrator command
    usage: /practice <reload|forcestop|debug|potion|ping>
    permission: practice.admin
  queue:
    description: Join or leave the selected practice queue
    usage: /queue <join|leave>
  spawn:
    description: Return to the practice lobby
    usage: /spawn
    aliases: [lobby]
  bot:
    description: Start, leave, or configure a practice bot match
    usage: /bot [start|settings|leave]
  ping:
    description: Show your current ping
    usage: /ping
  matchresult:
    description: Open a participant from your latest match result
    usage: /matchresult [player]
  chatterkb:
    description: Chattering knockback normalizer administration
    usage: /chatterkb <status|debug|mode|reload|reset|export>
  hitdebug:
    description: Enter or manage the isolated hit debug room
    usage: /hitdebug [enter|reset|leave]
    permission: practice.admin
  reachguard:
    description: ReachGuard administration and evidence inspection
    usage: /reachguard <status|inspect|alerts|mode|exempt|unexempt|resetvl|reload>
  combokb:
    description: View or tune independent Combo knockback and hit interval
    usage: /combokb [view [all|property]|set <property> <value>]
    permission: practice.admin
permissions:
  practice.admin:
    description: Allows administration of PoppyPractice
    default: op
  chatterkb.admin.*:
    description: Allows all ChatterKB administration commands
    default: op
    children:
      chatterkb.admin.status: true
      chatterkb.admin.debug: true
      chatterkb.admin.mode: true
      chatterkb.admin.reload: true
      chatterkb.admin.reset: true
      chatterkb.admin.export: true
  chatterkb.admin.status:
    default: op
  chatterkb.admin.debug:
    default: op
  chatterkb.admin.mode:
    default: op
  chatterkb.admin.reload:
    default: op
  chatterkb.admin.reset:
    default: op
  chatterkb.admin.export:
    default: op
  reachguard.admin:
    description: Allows all ReachGuard administration except bypass
    default: op
    children:
      reachguard.status: true
      reachguard.inspect: true
      reachguard.alerts: true
      reachguard.mode: true
      reachguard.reload: true
      reachguard.exempt: true
      reachguard.resetvl: true
  reachguard.status:
    default: op
  reachguard.inspect:
    default: op
  reachguard.alerts:
    default: op
  reachguard.mode:
    default: op
  reachguard.reload:
    default: op
  reachguard.exempt:
    default: op
  reachguard.resetvl:
    default: op
  reachguard.bypass:
    description: Bypasses ReachGuard checks (not granted to operators by default)
    default: false
