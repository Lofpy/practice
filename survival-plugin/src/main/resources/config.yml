# Must match server.properties level-name. Its Nether and End are protected too.
primary-world: survival
hub-server: lobby
scoreboard:
  enabled: true
  # 2 ticks = 100 ms; constrained to 2..200 ticks.
  update-ticks: 2
world-management:
  confirmation-seconds: 30
  # Additional worlds are opt-in, generated by /sworld create.
  # Registry: managed-worlds.yml. Archives: <world-container>/.ascending-deleted-worlds/.
